services:
  - type: web_service
    name: sam2-segmentation
    runtime: docker
    repo: https://github.com/rayobrian6/Solarpro
    branch: dev
    rootDir: sam2-service
    plan: standard
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: SAM2_HF_MODEL_ID
        value: facebook/sam2.1-hiera-small
      - key: SAM2_MIN_MASK_AREA_FRACTION
        value: "0.005"
      - key: SAM2_MAX_MASKS
        value: "20"
      - key: SAM2_DOUGLAS_PEUCKER_EPSILON
        value: "1.0"
      - key: SAM2_MAX_POLYGON_EDGE_LENGTH
        value: "50"
      - key: SAM2_MAX_IMAGE_DIM
        value: "512"
      - key: SAM2_POINTS_PER_SIDE
        value: "16"
      - key: SAM2_POINTS_PER_BATCH
        value: "4"
      - key: SAM2_PRED_IOU_THRESH
        value: "0.5"
      - key: SAM2_STABILITY_SCORE_THRESH
        value: "0.8"
      - key: SAM2_INFERENCE_BACKEND
        value: onnx
      - key: SAM2_ONNX_MODEL_FILENAME
        value: sam2.1_hiera_small_20260221.zip
      - key: MIDAS_ENABLED
        value: "true"
      - key: MIDAS_MODEL_ID
        value: Intel/dpt-swinv2-tiny-256
      - key: MIDAS_MAX_IMAGE_DIM
        value: "256"
      - key: MIDAS_OUTPUT_RESOLUTION
        value: "64"
      - key: PORT
        value: "10000"
