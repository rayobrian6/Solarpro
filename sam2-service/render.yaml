services:
  - type: web_service
    name: sam2-segmentation
    runtime: python
    repo: https://github.com/rayobrian6/Solarpro
    branch: dev
    rootDir: sam2-service
    plan: pro
    region: oregon
    buildPlan: pro
    healthCheckPath: /health
    envVars:
      - key: SAM2_CHECKPOINT
        value: sam2.1_hiera_small
      - key: SAM2_MIN_MASK_AREA_FRACTION
        value: "0.02"
      - key: SAM2_MAX_MASKS
        value: "20"
      - key: SAM2_DOUGLAS_PEUCKER_EPSILON
        value: "5.0"
      - key: PORT
        value: "8000"
      - key: PYTHON_VERSION
        value: "3.11.0"
