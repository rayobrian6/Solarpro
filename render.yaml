services:
  # ── OpenCV Photo Vision Service ──────────────────────────────────────────
  - type: web
    name: solarpro
    runtime: docker
    rootDir: external-workers/opencv-photo-vision
    plan: standard
    region: oregon
    branch: dev
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: YOLO_ENABLED
        value: "true"
      - key: YOLO_MODEL_PATH
        value: "yolov8n.pt"
      - key: YOLO_CONFIDENCE_THRESHOLD
        value: "0.25"
      - key: YOLO_IMAGE_SIZE
        value: "416"
      - key: YOLO_MAX_DETECTIONS
        value: "50"
      - key: TESSERACT_OCR_ENABLED
        value: "true"
      - key: TESSERACT_OCR_LANGUAGE
        value: "eng"
      - key: TESSERACT_OCR_MIN_CONFIDENCE
        value: "30"
      - key: MAX_IMAGE_BYTES
        value: "20971520"
      - key: FETCH_TIMEOUT_SECONDS
        value: "15"
      - key: MAX_FILES_PER_JOB
        value: "100"
      - key: PROCESSING_TIMEOUT_SECONDS
        value: "120"
      - key: BATCH_SIZE
        value: "10"
      - key: FETCH_CONCURRENCY
        value: "5"
      - key: OCR_ONLY_ON_YOLO_HITS
        value: "true"
      - key: SKIP_THUMBNAILS
        value: "true"
      - key: DATABASE_URL
        sync: false

  # ── Geometry Reconstruction Worker ───────────────────────────────────────
  # P1 — Execution Architecture: Render Background Worker
  # Polls Neon DB for queued Pipeline B jobs, claims atomically, and
  # executes the full reconstruction pipeline. This is the primary
  # execution path — Vercel only creates/queues jobs and returns 202.
  # Runs alongside the SAM2 segmentation service on the same Render
  # instance for low-latency SAM2 calls (no HTTP, same network).
  - type: worker
    name: geometry-reconstruction-worker
    runtime: docker
    rootDir: .
    plan: starter
    region: oregon
    branch: dev
    dockerContext: .
    dockerfilePath: ./worker/Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SAM2_SERVICE_URL
        value: "http://sam2-segmentation.onrender.com"
      - key: WORKER_POLL_INTERVAL_MS
        value: "5000"
      - key: WORKER_ID
        sync: false
      - key: SHUTDOWN_TIMEOUT_MS
        value: "30000"
