[project]
name = "solarpro-vision"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "opencv-python-headless==4.10.0.84",
    "numpy==2.2.1",
    "Pillow==11.0.0",
    "requests==2.32.3",
    "pydantic==2.10.4",
    "httpx==0.28.1",
    "ultralytics==8.3.55",
    "supervision==0.25.1",
    "pytesseract==0.3.13",
    "psycopg2-binary==2.9.10",
]

# Restrict uv dependency resolution to Linux only.
# ultralytics has numpy<2.0.0 on darwin (macOS), but numpy 2.2.1 is fine on Linux.
# Without this, uv resolves for ALL platforms and fails on the darwin marker.
[tool.uv]
environments = [
    "sys_platform == 'linux'",
]
