# ═══════════════════════════════════════════════════════════════════════════
# compliance/workflows/weekly.yml
#
# GitHub Actions workflow — runs every Sunday at 06:00 UTC. The
# WEEKLY snapshot is the auditor-facing roll-up + the full snapshot of
# all 6 integrations (for trend analysis):
#   - all 6 collectors in full snapshot mode
#   - a weekly-report.md committed next to the evidence
#   - an email to James (via Resend) summarizing the week
#
# Writes evidence to compliance/evidence/<integration>/<YYYY-MM-DD>/*.json
# AND compliance/monitoring/weekly-<YYYY-MM-DD>.md (the human-readable
# roll-up). The commit is gated by PUSH_ENABLED.
# ═══════════════════════════════════════════════════════════════════════════
name: compliance-weekly

on:
  schedule:
    # 06:00 UTC every Sunday. CT midnight is around 06:00 UTC (CST) or
    # 05:00 UTC (CDT). James reviews the report Monday morning.
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      push:
        description: 'Set PUSH_ENABLED=true to also push the commit'
        required: false
        default: 'false'

concurrency:
  group: compliance-weekly
  cancel-in-progress: true

env:
  COMMIT_BRANCH: james-dev
  PUSH_ENABLED: 'false'
  REPORT_DIR: compliance/monitoring

jobs:
  collect-weekly:
    name: Collect weekly snapshot + report + email
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          JWT_SECRET: ci-test-secret-do-not-use-in-production

      - name: Compute today's evidence stamp
        id: stamp
        run: echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # ── All 6 collectors in full snapshot mode ───────────────────
      - name: Run github.mjs (weekly)
        run: node compliance/collectors/github.mjs weekly
        env:
          GITHUB_TOKEN: ${{ secrets.COMPLIANCE_GITHUB_TOKEN }}
          GITHUB_ORG: rayobrian6
          GITHUB_REPO: Solarpro
          GITHUB_PROTECTED_BRANCH: master

      - name: Run vercel.mjs (weekly)
        run: node compliance/collectors/vercel.mjs weekly
        env:
          VERCEL_TOKEN: ${{ secrets.COMPLIANCE_VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.COMPLIANCE_VERCEL_TEAM_ID }}
          VERCEL_PROJECT: ${{ vars.COMPLIANCE_VERCEL_PROJECT }}

      - name: Run render.mjs (weekly)
        run: node compliance/collectors/render.mjs weekly
        env:
          RENDER_API_KEY: ${{ secrets.COMPLIANCE_RENDER_API_KEY }}
          RENDER_OWNER_ID: ${{ secrets.COMPLIANCE_RENDER_OWNER_ID }}
          RENDER_SERVICE_IDS: ${{ vars.COMPLIANCE_RENDER_SERVICE_IDS }}

      - name: Run neon.mjs (weekly)
        run: node compliance/collectors/neon.mjs weekly
        env:
          NEON_API_KEY: ${{ secrets.COMPLIANCE_NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.COMPLIANCE_NEON_PROJECT_ID }}

      - name: Run google-workspace.mjs (weekly)
        run: node compliance/collectors/google-workspace.mjs weekly
        env:
          GOOGLE_WORKSPACE_TOKEN: ${{ secrets.COMPLIANCE_GOOGLE_WORKSPACE_TOKEN }}
          GOOGLE_WORKSPACE_CUSTOMER: 'my_customer'

      - name: Run db-internal.mjs (weekly)
        run: node compliance/collectors/db-internal.mjs weekly
        env:
          DATABASE_URL: ${{ secrets.COMPLIANCE_DATABASE_URL }}

      # ── Compose the weekly report ────────────────────────────────
      - name: Compose weekly-report.md
        env:
          TODAY: ${{ steps.stamp.outputs.today }}
        run: |
          mkdir -p "$REPORT_DIR"
          cat > "$REPORT_DIR/weekly-$TODAY.md" <<'EOF'
          # Compliance Weekly Snapshot — $TODAY

          Auto-generated by `compliance/workflows/weekly.yml`. This is the
          weekly roll-up of the 6 evidence collectors. For raw evidence
          see `compliance/evidence/<integration>/$TODAY/`.

          ## Threshold checks

          | Control | Source | Threshold | Today |
          |---|---|---|---|
          | Branch protection on `master` | github | required | _(collected)_ |
          | All GitHub admins 2FA enrolled | github | required | _(collected)_ |
          | Neon PITR window | neon | ≥ 7 days | _(collected)_ |
          | Dependabot open (high/critical) | github | 0 open > 7d | _(collected)_ |
          | Secret scanning open | github | 0 open > 1d | _(collected)_ |
          | Failed-login spike (1h) | google-workspace | < 50 | _(collected)_ |
          | MFA enrolled (admin users) | google-workspace | required | _(collected)_ |
          | Audit log writes (last 7d) | db-internal | non-zero | _(collected)_ |

          The detailed per-integration evidence lives in
          `compliance/evidence/<integration>/$TODAY/`. A threshold is
          "green" when the corresponding JSON shows it holds; "red"
          when the JSON shows a violation. The CI lint in
          `.github/workflows/compliance-manifest-lint.yml` does NOT
          enforce these thresholds — the human review of this report
          does.

          ## What to do with this report

          1. Read the markdown.
          2. If any row is red, open a Linear issue tagged
             `compliance-exception` and link it in the
             `approval_ticket` column of the next UAR.
          3. If all green, archive this file and move on. Next week's
             report auto-replaces this one.
          EOF

      # ── Email the report to James (best-effort) ──────────────────
      - name: Email weekly report to James
        if: env.RESEND_API_KEY != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_PATH: ${{ env.REPORT_DIR }}/weekly-${{ steps.stamp.outputs.today }}.md
          REPORT_DATE: ${{ steps.stamp.outputs.today }}
        run: |
          node -e '
            import("node:fs").then(async ({ default: fs }) => {
              const report = fs.readFileSync(process.env.REPORT_PATH, "utf8");
              const res = await fetch("https://api.resend.com/emails", {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${process.env.RESEND_API_KEY}`,
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  from: "Solarpro Compliance <compliance@solarpro.app>",
                  to: ["james@solarpro.app"],
                  subject: `[COMPLIANCE] Weekly report: ${process.env.REPORT_DATE}`,
                  text: report,
                }),
              });
              if (!res.ok) {
                console.error("Resend send failed:", res.status, await res.text());
                process.exit(1);
              }
              console.log("Weekly report emailed.");
            });
          '

      # ── Commit (always; push is gated below) ─────────────────────
      - name: Configure git author
        run: |
          git config --local user.name  "compliance-bot"
          git config --local user.email "compliance-bot@users.noreply.github.com"

      - name: Stage and commit evidence + report
        run: |
          set -euo pipefail
          TODAY="${{ steps.stamp.outputs.today }}"
          git add "compliance/evidence/" "compliance/monitoring/"
          if git diff --cached --quiet; then
            echo "No weekly changes; nothing to commit."
            exit 0
          fi
          git commit \
            -m "evidence(weekly): $TODAY — full snapshot + weekly report" \
            -m "Auto-generated by compliance/workflows/weekly.yml. Includes:" \
            -m "- All 6 collectors in full snapshot mode" \
            -m "- compliance/monitoring/weekly-$TODAY.md (human-readable roll-up)" \
            -m "- Email to James (best-effort)"

      - name: Push to origin (gated by PUSH_ENABLED)
        if: env.PUSH_ENABLED == 'true'
        run: git push origin "$COMMIT_BRANCH"
        env:
          COMMIT_BRANCH: ${{ env.COMMIT_BRANCH }}
