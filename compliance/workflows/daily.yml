# ═══════════════════════════════════════════════════════════════════════════
# compliance/workflows/daily.yml
#
# GitHub Actions workflow — runs daily at 06:00 UTC. Calls the
# CONFIGURATION-STATE collectors (the slower cadence; daily is sufficient
# for SOC 2 sampling on configuration state per CC8.1 / A.8.9):
#   - github.mjs           (branch protection + member list + 2FA)
#   - vercel.mjs           (deployments + env-vars + members)
#   - render.mjs           (deploys + env-vars + members + events)
#   - neon.mjs             (branches + roles + PITR window)
#   - google-workspace.mjs (users + MFA + admin roles)
#
# Writes evidence to compliance/evidence/<integration>/<YYYY-MM-DD>/*.json
# and commits the diff. Push is gated by PUSH_ENABLED (default false).
# ═══════════════════════════════════════════════════════════════════════════
name: compliance-daily

on:
  schedule:
    # 06:00 UTC daily. Solarpro operates in CT; 06 UTC ≈ midnight CT,
    # which gives the team a clean morning reading.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      push:
        description: 'Set PUSH_ENABLED=true to also push the commit'
        required: false
        default: 'false'

concurrency:
  group: compliance-daily
  cancel-in-progress: true

env:
  COMMIT_BRANCH: james-dev
  PUSH_ENABLED: 'false'

jobs:
  collect-daily:
    name: Collect daily evidence + commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          JWT_SECRET: ci-test-secret-do-not-use-in-production

      - name: Compute today's evidence stamp
        id: stamp
        run: echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # ── GitHub: branch protection + members + 2FA ───────────────
      - name: Run github.mjs (daily)
        id: github
        run: node compliance/collectors/github.mjs daily
        env:
          GITHUB_TOKEN: ${{ secrets.COMPLIANCE_GITHUB_TOKEN }}
          GITHUB_ORG: rayobrian6
          GITHUB_REPO: Solarpro
          GITHUB_PROTECTED_BRANCH: master

      # ── Vercel: deployments + env-vars + members ────────────────
      - name: Run vercel.mjs (daily)
        id: vercel
        run: node compliance/collectors/vercel.mjs daily
        env:
          VERCEL_TOKEN: ${{ secrets.COMPLIANCE_VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.COMPLIANCE_VERCEL_TEAM_ID }}
          VERCEL_PROJECT: ${{ vars.COMPLIANCE_VERCEL_PROJECT }}

      # ── Render: deploys + env-vars + members + events ───────────
      - name: Run render.mjs (daily)
        id: render
        run: node compliance/collectors/render.mjs daily
        env:
          RENDER_API_KEY: ${{ secrets.COMPLIANCE_RENDER_API_KEY }}
          RENDER_OWNER_ID: ${{ secrets.COMPLIANCE_RENDER_OWNER_ID }}
          RENDER_SERVICE_IDS: ${{ vars.COMPLIANCE_RENDER_SERVICE_IDS }}

      # ── Neon: branches + roles + PITR window ────────────────────
      - name: Run neon.mjs (daily)
        id: neon
        run: node compliance/collectors/neon.mjs daily
        env:
          NEON_API_KEY: ${{ secrets.COMPLIANCE_NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.COMPLIANCE_NEON_PROJECT_ID }}

      # ── Google Workspace: users + MFA + admin roles ─────────────
      - name: Run google-workspace.mjs (daily)
        id: gws
        run: node compliance/collectors/google-workspace.mjs daily
        env:
          GOOGLE_WORKSPACE_TOKEN: ${{ secrets.COMPLIANCE_GOOGLE_WORKSPACE_TOKEN }}
          GOOGLE_WORKSPACE_CUSTOMER: 'my_customer'

      # ── Commit (always; push is gated below) ─────────────────────
      - name: Configure git author
        run: |
          git config --local user.name  "compliance-bot"
          git config --local user.email "compliance-bot@users.noreply.github.com"

      - name: Stage and commit evidence
        run: |
          set -euo pipefail
          TODAY="${{ steps.stamp.outputs.today }}"
          git add "compliance/evidence/"
          if git diff --cached --quiet; then
            echo "No evidence changes; nothing to commit."
            exit 0
          fi
          git commit \
            -m "evidence(daily): $TODAY — config-state snapshot" \
            -m "Auto-generated by compliance/workflows/daily.yml. Includes:" \
            -m "- github: branch protection + members + 2FA" \
            -m "- vercel: deployments + env-vars + members" \
            -m "- render: deploys + env-vars + members + events" \
            -m "- neon: branches + roles + PITR window" \
            -m "- google-workspace: users + MFA + admin roles"

      - name: Push to origin (gated by PUSH_ENABLED)
        if: env.PUSH_ENABLED == 'true'
        run: git push origin "$COMMIT_BRANCH"
        env:
          COMMIT_BRANCH: ${{ env.COMMIT_BRANCH }}
